behaviors:
  StarshipLander:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 81920
      learning_rate: 0.00002
      beta: 0.03       # Współczynnik entropii (zachęca do eksploracji)
      epsilon: 0.1          # Margines obcięcia (PPO clip)
      lambd: 0.95           # Współczynnik GAE (Generalized Advantage Estimation)
      num_epoch: 3          # Liczba epok optymalizacji na jedną partię
    network_settings:
      normalize: true       # Automatyczna normalizacja wektora 10 obserwacji
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995         # Dyskonto przyszłych nagród
        strength: 1.0
    max_steps: 15000000  # Całkowity budżet kroków treningu
    time_horizon: 256       # Horyzont zbierania trajektorii
    summary_freq: 5000      # Częstotliwość zapisu statystyk do wykresów
    keep_checkpoints: 20
    checkpoint_interval: 50000