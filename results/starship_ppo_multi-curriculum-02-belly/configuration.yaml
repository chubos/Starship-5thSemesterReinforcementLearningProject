default_settings: null
behaviors:
  StarshipLander:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.12
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 400000
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 20
    even_checkpoints: false
    max_steps: 15000000
    time_horizon: 256
    summary_freq: 20000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args:
  - --timeout
  - '180'
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  start_height:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6923
          value: 85.0
      name: Lesson1_Easy
      completion_criteria:
        behavior: StarshipLander
        measure: reward
        min_lesson_length: 60
        signal_smoothing: true
        threshold: 35.0
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6924
          value: 120.0
      name: Lesson2_Medium
      completion_criteria:
        behavior: StarshipLander
        measure: reward
        min_lesson_length: 80
        signal_smoothing: true
        threshold: 65.0
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6925
          value: 160.0
      name: Lesson3_FullBellyFlop
      completion_criteria: null
  max_flip_angle:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6926
          value: 30.0
      name: Lesson1_Easy
      completion_criteria:
        behavior: StarshipLander
        measure: reward
        min_lesson_length: 60
        signal_smoothing: true
        threshold: 35.0
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6927
          value: 60.0
      name: Lesson2_Medium
      completion_criteria:
        behavior: StarshipLander
        measure: reward
        min_lesson_length: 80
        signal_smoothing: true
        threshold: 65.0
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 6928
          value: 82.0
      name: Lesson3_FullBellyFlop
      completion_criteria: null
checkpoint_settings:
  run_id: starship_ppo_multi-curriculum-02-belly
  initialize_from: null
  load_model: false
  resume: true
  force: false
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
